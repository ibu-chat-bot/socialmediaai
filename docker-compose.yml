version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    env_file: .env.local
    depends_on:
      - api

  api:
    build:
      context: apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env.local
    depends_on:
      - redis

  workers:
    build:
      context: apps/workers
      dockerfile: Dockerfile
    env_file: .env.local
    depends_on:
      - redis

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
