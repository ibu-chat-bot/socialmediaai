version: '3.8'

services:
  # NEXT.JS FRONTEND
  web:
    build:
      context: ./apps/web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api

  # FASTAPI BACKEND
  api:
    build:
      context: ./apps/api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis

  # CELERY WORKER
  worker:
    build:
      context: ./apps/workers
    env_file:
      - .env
    depends_on:
      - redis

  # REDIS (Message Broker)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

networks:
  default:
    name: nailing-network
